name: Sync upstream

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - upstream-push

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Pull upstream and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Import upstream tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NoM0Re/WoW-3.3.5a-Addons.git
          git fetch upstream main

          # Replace upstream content, including removed files, while keeping
          # this mirror's workflows and scripts intact.
          git restore --source=upstream/main --staged --worktree -- . ':(exclude).github'

      - name: Rewrite mirror links
        shell: pwsh
        env:
          TARGET_REPO: ${{ github.repository }}
        run: |
          ./.github/scripts/rewrite-repo-links.ps1 `
            -SourceRepo "NoM0Re/WoW-3.3.5a-Addons" `
            -TargetRepo $env:TARGET_REPO

      - name: Show pending changes
        run: git status --short

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: sync/upstream
          delete-branch: true
          title: "Sync upstream changes"
          commit-message: "Sync upstream and rewrite mirror links"
          body: |
            Automated sync from `NoM0Re/WoW-3.3.5a-Addons`.

            This PR copies the upstream `main` tree and rewrites repository/page links to
            `${{ github.repository }}`, including the website catalog and plugin READMEs.

            The mirror's own `.github` configuration is preserved.
          labels: automated-sync
